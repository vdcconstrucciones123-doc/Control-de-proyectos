<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Site Audit Pro Lite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <div class="container py-3">
    <header class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <h1 class="h4 mb-0">Site Audit Pro Lite</h1>
      <div class="d-flex gap-1 flex-wrap">
        <button id="exportPdfBtn" class="btn btn-primary btn-sm">Exportar PDF</button>
        <button id="saveJsonBtn" class="btn btn-outline-secondary btn-sm">Guardar JSON</button>
        <button id="loadJsonBtn" class="btn btn-outline-secondary btn-sm">Cargar JSON</button>
      </div>
    </header>

    <section class="card mb-3 p-3">
      <div class="mb-2">
        <label class="form-label">Nombre de la empresa</label>
        <input id="companyName" class="form-control" value="VDC CONSTRUCCIONES SAC" placeholder="Ej: VDC CONSTRUCCIONES SAC">
      </div>
      <div class="mb-2">
        <label class="form-label">Nombre del Proyecto</label>
        <input id="projectName" class="form-control" placeholder="Ej: UNIFAMILIAR">
      </div>
      <div class="mb-2">
        <label class="form-label">Ubicación</label>
        <input id="projectLocation" class="form-control" placeholder="Ej: Urb. Los Olivos, Lima">
      </div>
      <div class="mb-2">
        <label class="form-label">Título del reporte</label>
        <input id="reportTitle" class="form-control" placeholder="Ej: REPORTE FOTOGRÁFICO DE OBRA">
      </div>
      <div class="row g-2">
        <div class="col-md-6">
          <label class="form-label">Para quién es</label>
          <input id="forWhom" class="form-control" placeholder="Ej: Cliente / Propietario">
        </div>
        <div class="col-md-6">
          <label class="form-label">De parte de quién es</label>
          <input id="fromWhom" class="form-control" placeholder="Ej: Arquitecto / Supervisor / Empresa">
        </div>
      </div>
      <div class="row g-2 align-items-end mt-1">
        <div class="col-8">
          <label class="form-label">Agregar Frente / Área</label>
          <input id="frontName" class="form-control" placeholder="Ej: Frente 2 / Fachada Norte / Área 1">
        </div>
        <div class="col-4">
          <button id="addFrontBtn" class="btn btn-success w-100">Agregar frente</button>
        </div>
      </div>
      <div class="d-flex gap-2 flex-wrap mt-2">
        <button id="loadTemplateBtn" class="btn btn-outline-primary btn-sm">Cargar plantilla de frentes</button>
        <button id="mergeAllDupBtn" class="btn btn-outline-warning btn-sm">Fusionar duplicados</button>
      </div>
      <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" id="autoMergeDup">
        <label class="form-check-label" for="autoMergeDup">Fusionar duplicados automáticamente al agregar</label>
      </div>
      <div id="duplicateAlert" class="mt-2"></div>
      <div id="frontList" class="mt-3"></div>
    </section>

    <section class="card mb-3 p-3">
      <h2 class="h6">Nueva entrada</h2>
      <div class="mb-2">
        <label class="form-label">Frente</label>
        <select id="selectFront" class="form-select"></select>
      </div>
      <div class="mb-2">
        <label class="form-label">Estado</label>
        <select id="statusSelect" class="form-select">
          <option value="En proceso">En proceso</option>
          <option value="Terminado">Terminado</option>
          <option value="Pendiente">Pendiente</option>
          <option value="Observado">Observado</option>
        </select>
      </div>
      <div class="mb-2">
        <label class="form-label">Descripción</label>
        <textarea id="entryDesc" class="form-control" rows="2" placeholder="Descripción breve"></textarea>
      </div>
      <div class="mb-2">
        <label class="form-label">Fotos</label>
        <div class="d-flex gap-2 flex-wrap mb-2">
          <button id="takePhotoBtn" type="button" class="btn btn-outline-primary btn-sm">Tomar foto</button>
          <button id="choosePhotoBtn" type="button" class="btn btn-outline-secondary btn-sm">Elegir archivo</button>
        </div>
        <input id="photoCameraInput" type="file" accept="image/*" capture="environment" multiple class="d-none">
        <input id="photoInput" type="file" accept="image/*" multiple class="d-none">
        <div class="form-text">Puedes tomar una foto nueva o elegir imágenes guardadas.</div>
      </div>
      <div class="mb-2">
        <button id="addEntryBtn" class="btn btn-primary">Agregar entrada</button>
      </div>
    </section>

    <section class="card mb-3 p-3">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
        <h2 class="h6 mb-0">Reporte (vista previa)</h2>
        <div class="form-check mb-0">
          <input class="form-check-input" type="checkbox" id="combineByStatus">
          <label class="form-check-label" for="combineByStatus">Combinar entradas con mismo estado</label>
        </div>
      </div>
      <div id="reportContainer" class="report-container"></div>
    </section>

    <footer class="text-muted small">Generado con Site Audit Pro Lite • Guarda en el dispositivo y exporta PDF</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
