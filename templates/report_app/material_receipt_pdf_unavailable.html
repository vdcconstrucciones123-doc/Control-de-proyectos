<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>PDF pendiente - Acta de materiales</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #172033; background: #f1f5f9; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; padding: 20px 12px; place-items: center; }
    main { width: min(100%, 480px); padding: 24px; border: 1px solid #dbe3ee; border-radius: 12px; background: #fff; box-shadow: 0 8px 26px rgb(15 23 42 / 5%); text-align: center; }
    h1 { margin: 0 0 10px; color: #1e3a8a; font-size: 1.3rem; }
    p { margin: 0 0 20px; color: #475569; line-height: 1.5; }
    a { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; padding: 9px 14px; border-radius: 6px; background: #28599c; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>PDF pendiente</h1>
    <p>El PDF estará disponible cuando los tres responsables hayan firmado.</p>
    <a href="{% url 'material_receipt_share' share_token=share_token %}">Volver al acta</a>
  </main>
</body>
</html>
