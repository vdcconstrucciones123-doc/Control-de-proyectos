{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Site Audit Pro Lite{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'report_app/theme.css' %}?v=1">
  <link rel="stylesheet" href="{% static 'report_app/styles.css' %}?v=26">
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" data-app-theme="site-audit" data-current-user="{% if request.user.is_authenticated %}{{ request.user.username }}{% else %}guest{% endif %}">
  {% block pre_content %}
  <script>
    window.INIT_PROJECT_SLUG = "{% if project_slug %}{{ project_slug }}{% else %}{% endif %}";
    window.INIT_REPORT_ID = "{% if report_id %}{{ report_id }}{% else %}{% endif %}";
    window.INIT_NEW_REPORT = {% if new_report %}true{% else %}false{% endif %};
    window.INIT_NEW_PROJECT = {% if new_project %}true{% else %}false{% endif %};
    window.INIT_EDIT_PROJECT = {% if edit_project %}true{% else %}false{% endif %};
  </script>
  {% endblock %}
  {% block content %}{% endblock %}

  {% block scripts %}
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="{% static 'report_app/app.js' %}?v=26"></script>
  {% endblock %}
</body>
</html>
